<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tag </title>
</head>
<body>
    <center>
        <p><h1>Sign in</h1></p>
        <form>Name:<input type="text" name="Username" placeholder="Enter Username"/> </form><br><br>
        <form>Password:<input type="text" name="password" placeholder="Password"/></form><br><br>
        <form>Confirm password<input type="password" name="Confirm password" placeholder="Confirm password"/></form><br><br>
        <form>Phone:<input type="number" name="Phone" placeholder="Phone"/></form><br><br>
        <form>Email:<input type="text" name="Email" placeholder="Email"/></form><br><br>
        <form>Address:<input type="text" name="Address" placeholder="Address"/></form><br><br>
        <form><button>Sign up</button></form>
    </center>
</body>
</html>
