<!DOCTYPE html>
<html>
<head>
    <title>Color Table</title>
    <style>
        td {
            height: 100px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .red:hover {
            background-color: red;
        }

        .blue:hover {
            background-color: blue;
        }

        .green:hover {
            background-color: green;
        }

        .yellow:hover {
            background-color: yellow;
        }

        .orange:hover {
            background-color: orange;
        }

        .purple:hover {
            background-color: purple;
            color: white;
        }

        .pink:hover {
            background-color: pink;
        }

        .brown:hover {
            background-color: brown;
            color: white;
        }

        .gray:hover {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td class="red">Red</td>
            <td class="blue">Blue</td>
            <td class="green">Green</td>
        </tr>

        <tr>
            <td class="yellow">Yellow</td>
            <td class="orange">Orange</td>
            <td class="purple">Purple</td>
        </tr>

        <tr>
            <td class="pink">Pink</td>
            <td class="brown">Brown</td>
            <td class="gray">Gray</td>
        </tr>
    </table>
</body>
</html>
