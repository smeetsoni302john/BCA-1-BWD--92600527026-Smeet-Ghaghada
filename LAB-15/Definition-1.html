<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover in Image</title>
    <style>
        img{
            transition: 1s;
            cursor: pointer;
        }
        img:hover{
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <img src="Car.jpg" alt="Car Image" height="800px" width="1200px">
</body>
</html>
