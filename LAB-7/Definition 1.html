<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" conVtent="width=device-width, initial-scale=1.0">
    <title>Internal css for text property</title>
    <style>
        h1{
            color: blue;
            font-size: 50px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-transform: capitalize;
            letter-spacing: 3px;
        }
        p{
            color: aqua;
            font-size: 40px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-transform: lowercase;
            letter-spacing: 4px;
        }
        h4{
            color: chocolate;
            font-size: 40px;
            font-weight: bold;
            text-align: justify;
            text-align: right;
            font-family: monospace;
            letter-spacing: 2px;
        } 
    </style>
</head>
<body>
    <center>
        <p><h1>Text property using Inline css</h1></p>
    </center>
    <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. </p>
    <br>
    <p><h4>Expedita nobis impedit possimus, quisquam ipsa numquam quas culpa non sapiente commodi sed repellendus corporis vitae nesciunt et adipisci ut. Dolor, eos!</h4></p>
</body>
</html>
