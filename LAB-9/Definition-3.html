<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Shapes</title>
    <style>
        .circle{
            width: 100px;
            height: 100px;
            background-color: aqua;
            border-radius: 50%;
        }
        .Square{
            height: 100px;
            width: 100px;
            background-color: blue;
        }
        .Rectangle{
            height:50px;
            width:200px;
            background-color:black;
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>Circle</h1>
    <div class="circle"></div>

    <br><br>

    <h1>Square</h1>
    <div class="Square"></div>

    <br><br>

    <h1>Rectangle</h1>
    <div class="Rectangle"></div>
    
</body>
</html>
