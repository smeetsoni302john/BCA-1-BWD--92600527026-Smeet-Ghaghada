<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Form</title>
</head>
<body>
    <p><b><h1>🩸Blood Donation Form</h1></b></p>

    <br>

    <p>_________________________________________________________________________</p>
    <p>Blood Donor Information</p>

    <br>

    <form>Donor's Name* <br> 
        <input type="text" placeholder="First" />   <input type="text" placeholder="Last"/>
    </form>

    <br>
    
    <form> Date of Birth <br>
        <input type="date" placeholder="dd-mm-yyyy"/>
    </form>
    
    <br>
    
    <form>Email* <br>
        <input type="text"/>  <form>Phone* 
            <input type="number" placeholder="### ### ###"/></form>
    </form>

    <br>

    <form>Home Address* <br>
        <input type="text" placeholder="Street Address"/>

        <br><br>

        <input type="text" placeholder="Street Address Line 2"/>
        
        <br><br>
        
        <input type="text" placeholder="city"/> <input type="text" placeholder="Region"/>
        
        <br><br>
        
        <input type="number" placeholder="Postal / Zip Code"/>  <input type="text" placeholder="Country"/>
    </form>
    
    <br><br>
    
    <form>Occupation* <br>
        <input type="text"/>
    </form>
    
    <br><br>
    
    <form>Blood type* <br>
        <input type="text" placeholder="*"/>
    </form>
    
    <br><br>
    
    <form><button>Registration</button></form>
</body>
</html>
